# Save as: config/packages/pool-cleaner-schedule.yaml
# configuration.yaml must have:  packages: !include_dir_named packages
#
# Creates helpers + script + automation for the Pool Cleaner Card schedule panel.
# Edit `power:` below to your Dolphin Power switch entity_id.

input_boolean:
  pool_cleaner_schedule_enabled:
    name: Pool cleaner schedule enabled
    icon: mdi:calendar-clock

input_datetime:
  pool_cleaner_schedule_time:
    name: Pool cleaner start time
    has_date: false
    has_time: true

input_select:
  pool_cleaner_schedule_duration:
    name: Pool cleaner run duration
    options:
      - "1 hour"
      - "2 hours"

input_text:
  pool_cleaner_schedule_days:
    name: Pool cleaner schedule days
    max: 32
    initial: "0,1,2,3,4,5"

script:
  pool_cleaner_timed_run:
    alias: Pool cleaner timed run
    mode: restart
    fields:
      power_entity:
        description: Dolphin Power switch entity_id
        example: switch.triton_ps_plus_power
      duration_minutes:
        description: Run time in minutes
        example: 120
    sequence:
      - action: switch.turn_on
        target:
          entity_id: "{{ power_entity }}"
      - delay:
          minutes: "{{ duration_minutes | int }}"
      - action: switch.turn_off
        target:
          entity_id: "{{ power_entity }}"

automation:
  - id: pool_cleaner_scheduled_run
    alias: Pool cleaner scheduled start
    description: Turns on at set time/day, auto off after 1h or 2h
    trigger:
      - platform: time
        at: input_datetime.pool_cleaner_schedule_time
    condition:
      - condition: state
        entity_id: input_boolean.pool_cleaner_schedule_enabled
        state: "on"
      - condition: template
        value_template: >
          {% set days = states('input_text.pool_cleaner_schedule_days').split(',') | map('trim') | list %}
          {{ now().weekday() | string in days }}
    action:
      - variables:
          power: switch.triton_ps_plus_power  # ← change to your Power switch
          mins: >
            {% if is_state('input_select.pool_cleaner_schedule_duration', '1 hour') %}60{% else %}120{% endif %}
      - action: script.pool_cleaner_timed_run
        data:
          power_entity: "{{ power }}"
          duration_minutes: "{{ mins }}"
    mode: restart
