# Pool cleaner card with schedule panel (requires examples/pool-cleaner-schedule.yaml in packages/)
type: custom:pool-cleaner-card
name: Pool Dolphin
device: YOUR_DEVICE_ID
show_cleaner_when: auto
show_schedule: true
entity_schedule_enabled: input_boolean.pool_cleaner_schedule_enabled
entity_schedule_time: input_datetime.pool_cleaner_schedule_time
entity_schedule_duration: input_select.pool_cleaner_schedule_duration
entity_schedule_days: input_text.pool_cleaner_schedule_days
entity_schedule_2_enabled: input_boolean.pool_cleaner_schedule_2_enabled
entity_schedule_time_2: input_datetime.pool_cleaner_schedule_time_2
entity_schedule_duration_2: input_select.pool_cleaner_schedule_duration_2
entity_script_timed: script.pool_cleaner_timed_run
